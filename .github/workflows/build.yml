name: Build Warpus Kong

on:
  workflow_dispatch:
  push:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-64bit
            os: windows-latest
            args: "-A x64"
          - name: Windows-32bit
            os: windows-latest
            args: "-A Win32"
          - name: macOS
            os: macos-latest
            args: "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          - name: Linux
            os: ubuntu-latest
            args: ""
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Dependances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev

      - name: Configuration
        run: cmake -B build ${{ matrix.args }} -DCMAKE_BUILD_TYPE=Release

      - name: Compilation
        run: cmake --build build --config Release --parallel

      - name: Envoi du resultat
        uses: actions/upload-artifact@v4
        with:
          name: WarpusKong-${{ matrix.name }}
          path: |
            build/WarpusKong_artefacts/Release/VST3
            build/WarpusKong_artefacts/Release/Standalone
